name: Release zip

# Builds the zip that replaces a BF2 server's binaries in bin/amd-64 and publishes it as a GitHub release:
#   openbf2-serverext-<openbf2>-<module>-<bf2hub>-<backend>.zip   bf2, libdice_py.so (OpenBF2), libserverext.so (this
#                                                                repo), libbf2hub.so (OpenBF2-BF2Hub), source.txt
# It runs release/build.sh, the same script and builder image (release/Dockerfile, Ubuntu 22.04) as a local build, from
# a clean build directory. The module's unit tests run inside the build. The same three commits always give the same
# zip, so a release is never replaced: a second run for the same commits fails at the publish step.
#
# The release's tag is the zip's name without ".zip", on the module commit that was built. The download URL is
#   https://github.com/<owner>/<repo>/releases/download/<tag>/<tag>.zip
# and the release also carries the zip's .sha512 and the -debug.tar.gz with the unstripped binaries.

on:
  workflow_dispatch:
    inputs:
      openbf2_ref:
        description: Branch, tag or commit of github.com/nihlen/OpenBF2 (OpenBF2 with the IServerExtension additions)
        default: serverext/r1
      bf2hub_ref:
        description: Branch, tag or commit of github.com/B2BF/OpenBF2-BF2Hub
        default: 7e378545fe5b0235041d6a70a4035f69c814c30a
      publish:
        description: 'Publish a GitHub release (when off, the zip is only a workflow artifact)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zip:
    name: Build the release zip
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write   # the publish step creates the tag and the release
    steps:
      - name: Check out the module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: module
          persist-credentials: false

      - name: Check out OpenBF2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nihlen/OpenBF2
          ref: ${{ inputs.openbf2_ref }}
          path: openbf2
          persist-credentials: false

      - name: Check out OpenBF2-BF2Hub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: B2BF/OpenBF2-BF2Hub
          ref: ${{ inputs.bf2hub_ref }}
          path: bf2hub
          persist-credentials: false

      - name: Build, test and package
        env:
          OPENBF2_REPO: ${{ github.workspace }}/openbf2
          MODULE_REPO: ${{ github.workspace }}/module
          BF2HUB_REPO: ${{ github.workspace }}/bf2hub
          OUT: ${{ github.workspace }}/out
          CLEAN: '1'
          JOBS: '2'
        run: |
          module/release/build.sh
          # out/ holds exactly one zip; its name ends with the GameSpy backend (e.g. -bf2hub.zip)
          zip=$(ls out/*.zip)
          {
            echo '```'
            cat "$zip.sha512"
            unzip -p "$zip" source.txt
            echo '```'
          } > notes.md
          { echo '### Release zip'; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbf2-serverext
          path: |
            out/*.zip
            out/*.zip.sha512
            out/*-debug.tar.gz
            out/*.build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          zip=$(ls out/*.zip)
          tag=$(basename "$zip" .zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists already: the same commits give the same zip, so it is not replaced" >&2
            exit 1
          fi
          gh release create "$tag" "$zip" "$zip.sha512" "out/$tag-debug.tar.gz" \
            --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          echo "https://github.com/$GH_REPO/releases/download/$tag/$tag.zip" >> "$GITHUB_STEP_SUMMARY"
